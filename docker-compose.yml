# Solo Redis para desarrollo local (la base es Supabase).
services:
  redis:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-devpassword}
      --appendonly yes --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
volumes:
  redis-data:
